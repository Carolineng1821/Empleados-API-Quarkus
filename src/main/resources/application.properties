# Configuración de la base de datos H2
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/empleados
quarkus.datasource.username=sa
quarkus.datasource.password=

# Configuración de Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=update

# Activar en PowerShell: $env:QUARKUS_PROFILE = 'postgres'
%postgres.quarkus.datasource.db-kind=postgresql
%postgres.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/empleados
%postgres.quarkus.datasource.username=${DB_USERNAME}
%postgres.quarkus.datasource.password=${DB_PASSWORD}

# Emisor esperado en los tokens JWT
mp.jwt.verify.issuer=empleados-api