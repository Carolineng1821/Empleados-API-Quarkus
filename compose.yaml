services:
  api:
    image: empleados-api:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_PROFILE: prod
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/empleados
      DB_USERNAME: "${DB_USERNAME:?Define DB_USERNAME en .env}"
      DB_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en .env}"
    ports:
      - "8080:8080"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: empleados
      POSTGRES_USER: "${DB_USERNAME:?Define DB_USERNAME en .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en .env}"
    ports:
      - "5432:5432"
    volumes:
      - empleados_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  empleados_postgres_data: